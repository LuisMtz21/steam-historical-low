name: Temporary production verification

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/production-verification.yml

jobs:
  verify:
    if: contains(github.event.head_commit.message, '[RUN-VERIFY]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for Cloudflare Workers Build deployment
        run: sleep 60

      - name: Run one production wishlist check
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 5 --retry-delay 10 --retry-all-errors \
            --request POST \
            https://steam-historical-low.luismtz21.workers.dev/api/run
